<!doctype html>
<html lang="en">
<head>

<title>ra9-atlas — map-first prototype</title>
<style>
:root{color-scheme:light;--bg:#f3f5f6;--surface:#ffffff;--panel:#fbfcfd;--line:#d5dce1;--text:#202a33;--muted:#596875;--dim:#75838e;--lime:#286b9e;--blue:#1d6b9f;--amber:#9a6a20;--red:#9b514a}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}a{color:#bad5f1}a:hover{text-decoration:underline}.muted{color:var(--muted)}.tiny{font-size:11px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}.cover{height:100%;display:grid;place-items:center;padding:24px}.cover-box{max-width:580px;border:1px solid var(--line);background:var(--surface);padding:32px;border-radius:12px}.cover h1{font-size:30px;line-height:1.2;margin:8px 0 16px}.cover p{color:var(--muted)}.primary{background:var(--lime);border:1px solid var(--lime);color:#111;padding:10px 16px;border-radius:6px;font-weight:750}.primary:hover{background:#f5ff73}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);z-index:4}.brand{min-width:180px}.brand strong{font-size:17px;letter-spacing:-.03em}.brand span{display:block;color:var(--muted);font-size:11px}.chapters{display:flex;gap:4px;overflow:auto;min-width:0;scrollbar-width:thin}.chapter{padding:8px 11px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);white-space:nowrap;text-align:left;font-size:12px;line-height:1.25}.chapter:hover{background:#202124;color:var(--text)}.chapter.active{background:#232523;border-color:#4f5642;color:var(--text)}.chapter small{display:block;color:var(--dim);font-size:10px}.top-right{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}.search{background:#1a1c1e;color:var(--text);border:1px solid var(--line);border-radius:6px;width:185px;padding:8px 10px}.tool{background:#1a1c1e;border:1px solid var(--line);border-radius:6px;min-height:33px;padding:5px 9px;color:#d9dde2}.tool:hover{background:#292c2e}.tool.active{border-color:var(--lime);color:var(--lime)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}.canvas-wrap{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(#d9e0e4 .7px,transparent .7px);background-size:20px 20px;cursor:grab;touch-action:none}.canvas-wrap.dragging{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0;width:1850px;height:990px}.edge-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}.edge{fill:none;stroke:#7b8790;stroke-width:1.7;vector-effect:non-scaling-stroke}.edge.conditional{stroke-dasharray:7 5;stroke:#b39669}.edge.unresolved{stroke-dasharray:4 6;stroke:#c29387}.edge.active{stroke:var(--lime);stroke-width:2.6}.edge.dimmed{opacity:.2}.edge-label{position:absolute;color:#c7cbd0;font-size:11px;line-height:1.2;max-width:180px;background:#f3f5f6;padding:3px 5px;transform:translate(-50%,-50%);border:1px solid #3d4044;border-radius:3px;pointer-events:none}.edge-label.unresolved{color:var(--red)}.edge-label.dimmed{opacity:.2}.stage{position:absolute;top:18px;border-top:1px solid #404247;padding-top:8px;color:#777d87;letter-spacing:.14em;font-size:12px;text-transform:uppercase;pointer-events:none}.node{position:absolute;width:180px;min-height:58px;border:1px solid #aeb9c1;border-radius:3px;background:#ffffff;text-align:left;padding:9px 11px;box-shadow:0 1px 3px #23313a18}.node:hover{background:#f0f5f8;border-color:#526b7a}.node.selected{background:#e8f2f8;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.node.dimmed{opacity:.25}.node-title{font-weight:700;font-size:14px;line-height:1.26}.node-sub{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.2}.node .mark{float:right;color:var(--amber);font-size:11px;margin-left:6px}.node.outcome{border-color:#87949c;background:#edf1f3}.node.outcome .node-title{font-size:13px}.node.context{border-color:#9daab2}.node.unknown{border-style:dashed;border-color:#a7665e}.node.unknown .mark{color:var(--red)}.node.milestone{border-color:#286b9e;background:#e4f0f7}.node.milestone .node-title{color:#174f75}.status-line{position:absolute;left:16px;bottom:16px;z-index:2;border:1px solid var(--line);background:#ffffffed;border-radius:7px;padding:9px 11px;max-width:480px;color:var(--muted);font-size:11px}.zoom{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:4px;background:#ffffff;border:1px solid var(--line);border-radius:7px;padding:4px;z-index:2}.zoom span{min-width:40px;text-align:center;color:var(--muted);font-size:11px}.mini{position:absolute;right:16px;top:16px;width:172px;height:100px;border:1px solid #45484b;border-radius:6px;background:#ffffffed;z-index:2;overflow:hidden}.mini svg{width:100%;height:100%}.mini-label{position:absolute;top:5px;left:7px;font-size:9px;color:#a4aab3;letter-spacing:.1em;text-transform:uppercase}.inspector{width:345px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px}.inspector[hidden]{display:none}.inspector h2{font-size:21px;line-height:1.2;margin:10px 0 8px}.inspector h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.inspector p{color:#cbd0d6;margin:8px 0}.inspector section{border-top:1px solid #34363b;padding:14px 0}.inspector .close{float:right}.badge{display:inline-block;border:1px solid #5d6269;border-radius:4px;padding:3px 6px;font-size:10px;color:#d3d8df;margin:3px 3px 3px 0}.badge.unresolved{border-color:#996e6e;color:#f1b7b7}.badge.single{border-color:#9a7b4a;color:#ecd3a2}.badge.match{border-color:#5e8393;color:#bbdce9}.linkrow{display:block;width:100%;border:1px solid #484c51;border-radius:5px;background:#ffffff;text-align:left;padding:7px 9px;margin:5px 0;font-size:12px}.linkrow:hover{background:#edf2f5}.search-list{position:absolute;right:16px;top:124px;z-index:5;background:#ffffff;border:1px solid #55595f;border-radius:6px;width:285px;max-height:300px;overflow:auto;padding:6px;box-shadow:0 12px 30px #0009}.search-list[hidden]{display:none}.search-list button{width:100%;background:transparent;border:0;border-radius:4px;text-align:left;padding:7px 8px}.search-list button:hover{background:#edf2f5}.search-list small{display:block;color:var(--muted)}
.node-title .short{display:none}.world.overview .node{padding:5px 8px}.world.overview .node-title{font-size:25px;line-height:1.02}.world.overview .node-title .full,.world.overview .node-sub{display:none}.world.overview .node-title .short{display:inline}.world.overview .node .mark{display:none}.world.overview .edge-label{font-size:24px;max-width:360px}.world.overview .stage{font-size:25px}
@media(max-width:850px){.top{flex-wrap:wrap}.brand{min-width:130px}.chapters{order:3;width:100%}.search{width:125px}.inspector{width:290px}.mini{display:none}.status-line{max-width:230px}}
@media(max-width:620px){.top{gap:6px;padding:7px}.brand strong{font-size:14px}.brand span{display:none}.top-right{gap:3px}.search{width:105px}.workspace{display:block;position:relative}.canvas-wrap{height:100%}.inspector{position:absolute;right:0;top:0;bottom:0;width:min(88vw,350px);z-index:3;box-shadow:-10px 0 30px #0009}.status-line{left:8px;bottom:8px;max-width:170px;font-size:10px}.zoom{right:8px;bottom:8px}.search-list{top:104px;right:8px}}
</style>
</head>
<body><div id="app"></div>
<script src="map-data.js"></script>
<script>
/* Throwaway UI prototype: visible branching graph, with details secondary. */
let state={consent:false,map:'all',selected:null,scale:1,tx:0,ty:0,query:'',filter:false};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const node=id=>maps[state.map].nodes.find(n=>n.id===id);const linked=id=>new Set(maps[state.map].edges.filter(e=>e.from===id||e.to===id).flatMap(e=>[e.from,e.to]));
function renderShell(){if(!state.consent){app.innerHTML='<div class="cover"><div class="cover-box"><div class="eyebrow">ra9-atlas · throwaway map prototype</div><h1>Full spoilers ahead</h1><p>This map reveals choices and outcomes from Detroit: Become Human, including late-game branches.</p><p>Three illustrative areas are shown. They are guide-based and do not represent full game coverage or in-game verification.</p><button class="primary" id="consent">Show example map</button></div></div>';document.getElementById('consent').onclick=()=>{state.consent=true;renderShell();fit()};return}
 app.innerHTML=`<div class="app"><header class="top"><div class="brand"><strong>ra9-atlas</strong><span>map-first prototype · illustrative</span></div><nav class="chapters" aria-label="Sample chapter map">${Object.entries(maps).map(([id,m])=>`<button class="chapter ${state.map===id?'active':''}" data-map="${id}" aria-pressed="${state.map===id}">${esc(m.name)}<small>${esc(m.code)}</small></button>`).join('')}</nav><div class="top-right"><input class="search" type="search" placeholder="Find a node…" aria-label="Find a node" value="${esc(state.query)}"><button class="tool" id="fit" title="Fit map">Fit map</button><button class="tool ${state.filter?'active':''}" id="filter" title="Dim nodes unrelated to selection">Focus connections</button></div></header><div class="workspace"><main class="canvas-wrap" aria-label="Interactive flowchart"><div class="world" id="world"><svg class="edge-layer" id="edges"></svg><div id="stages"></div><div id="nodes"></div><div id="labels"></div></div><div class="mini" id="mini"><div class="mini-label">Overview</div><svg id="mini-svg"></svg></div><div class="search-list" id="search-list" hidden></div><div class="status-line">${esc(maps[state.map].code)} · selected sources are guides or screenshot OCR; game version and platform unknown. Drag to pan · scroll to zoom.</div><div class="zoom"><button class="tool" id="minus" aria-label="Zoom out">−</button><span id="zoom-label"></span><button class="tool" id="plus" aria-label="Zoom in">+</button></div></main><aside class="inspector" id="inspector" hidden></aside></div></div>`;
 document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>switchMap(b.dataset.map));document.getElementById('fit').onclick=fit;document.getElementById('filter').onclick=()=>{state.filter=!state.filter;renderGraph()};document.getElementById('minus').onclick=()=>zoomAt(.8);document.getElementById('plus').onclick=()=>zoomAt(1.25);document.querySelector('.search').oninput=e=>{state.query=e.target.value;renderSearch()};setupCanvas();renderGraph();}
function switchMap(id,select=null){state.map=id;state.selected=select;state.filter=false;state.query='';history.replaceState(null,'',select?'#'+select:'#'+id);renderShell();fit()}
function shortTitle(title){return title.replace('Investigate ','').replace('Connor shoots ','Shoot ').replace('Daniel shoots Connor','Connor shot').replace('Security checkpoint','Checkpoint').replace('More than 11 minutes','Over 11 min').replace('Less than 11 minutes','Under 11 min').replace('Alice gives Kara a key','Alice gives key').replace('Confront deviant outside','Confront Daniel').replace('Negotiate with Daniel','Negotiate').replace('Clean first floor','First floor').replace('Clean second floor','Second floor').replace('Kara and Alice reach terminal','Reach terminal').replace('Todd survived Stormy Night','Todd survives').replace('Todd sends soldiers away','Soldiers leave').replace('Late / last bus departed','Bus departed').replace('Exactly 11:00: unknown','11:00 unknown')}
function renderGraph(){const m=maps[state.map],focus=state.selected?linked(state.selected):null;document.getElementById('world').style.width=m.width+'px';document.getElementById('world').style.height=m.height+'px';document.getElementById('stages').innerHTML=m.stages.map(([t,x,w,y],i)=>`<div class="stage" style="left:${x}px;width:${w}px;top:${y??(m===maps.kara&&i===1?500:18)}px">${esc(t)}</div>`).join('');
 const svg=document.getElementById('edges');svg.setAttribute('viewBox',`0 0 ${m.width} ${m.height}`);svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);let edgeHtml='',labels='';for(const e of m.edges){const a=m.nodes.find(n=>n.id===e.from),b=m.nodes.find(n=>n.id===e.to);const x1=a.x+180,y1=a.y+29,x2=b.x,y2=b.y+29;const mid=x1+(x2-x1)/2;const path=`M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`;const active=state.selected&&(e.from===state.selected||e.to===state.selected);const dim=state.filter&&focus&&!active;edgeHtml+=`<path d="${path}" class="edge ${e.kind||''} ${active?'active':''} ${dim?'dimmed':''}"/>`;if(e.label)labels+=`<div class="edge-label ${e.kind||''} ${dim?'dimmed':''}" style="left:${mid}px;top:${(y1+y2)/2}px">${esc(e.label)}</div>`}svg.innerHTML=edgeHtml;document.getElementById('labels').innerHTML=labels;
 document.getElementById('nodes').innerHTML=m.nodes.map(n=>`<button class="node ${['o-start','o-meet','o-checkpoint','h-start','h-use','a-welcome','a-box','k-terminal','k-meet'].includes(n.id)?'milestone':''} ${n.type||''} ${state.selected===n.id?'selected':''} ${state.filter&&focus&&!focus.has(n.id)?'dimmed':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px" aria-label="${esc(n.title)}${n.status==='unresolved'?', unresolved':''}"><span class="mark">${n.status==='unresolved'?'?':n.status==='single'?'◇':''}</span><span class="node-title"><span class="full">${esc(n.title)}</span><span class="short">${esc(n.short||shortTitle(n.title))}</span></span>${n.sub?`<span class="node-sub">${esc(n.sub)}</span>`:''}</button>`).join('');document.querySelectorAll('[data-node]').forEach(b=>b.onclick=e=>{e.stopPropagation();select(b.dataset.node)});renderInspector();drawMini();updateTransform();document.getElementById('filter').classList.toggle('active',state.filter)}
function select(id){state.selected=id;history.replaceState(null,'','#'+id);renderGraph();ensureVisible(node(id))}
function ensureVisible(n){const c=document.querySelector('.canvas-wrap'),pad=24,left=n.x*state.scale+state.tx,right=(n.x+180)*state.scale+state.tx,top=n.y*state.scale+state.ty,bottom=(n.y+70)*state.scale+state.ty;if(left<pad)state.tx+=pad-left;else if(right>c.clientWidth-pad)state.tx-=right-(c.clientWidth-pad);if(top<pad)state.ty+=pad-top;else if(bottom>c.clientHeight-pad)state.ty-=bottom-(c.clientHeight-pad);updateTransform()}
function renderInspector(){const el=document.getElementById('inspector');if(!state.selected){el.hidden=true;return}const n=node(state.selected),d=detail[n.source||n.id]||{},m=maps[state.map];el.hidden=false;const related=m.edges.filter(e=>e.from===n.id||e.to===n.id);el.innerHTML=`<button class="tool close" id="close" aria-label="Close details">×</button><div class="eyebrow">${esc(m.name)} · selected node</div><h2>${esc(n.title)}</h2><span class="badge ${n.status||''}">${esc(d.status||({match:'Guide-reported · matching sources',single:'Guide-reported · single source',unresolved:'Unresolved'}[n.status]||'Screenshot OCR context'))}</span><p>${esc(d.summary||'A visible branch in this illustrative map. Open a connected node to inspect its conditions and evidence.')}</p><section><h3>Connected branches</h3>${related.map(e=>{const other=e.from===n.id?e.to:e.from;return `<button class="linkrow" data-related="${other}">${e.from===n.id?'→':'←'} ${esc(m.nodes.find(x=>x.id===other).title)}${e.kind?' · '+esc(e.kind):''}</button>`}).join('')||'<p>No connected branch in this sample.</p>'}</section>${d.jump?`<section><h3>Cross-chapter example</h3><p class="muted tiny">Unresolved link; prerequisites must still be met.</p><button class="linkrow" id="jump">Open later Todd meeting →</button></section>`:''}<section><h3>Evidence</h3><p class="tiny muted">Secondary guides and screenshot OCR only. No in-game verification. Version: unknown. Platform: unknown.</p>${(d.sources||[['Steam chapter screenshot · visual reference','steam']]).map(([label,key])=>`<p><a href="${refs[key]}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a></p>`).join('')}</section>${d.unknown?`<section><h3>Still unknown</h3><p>${esc(d.unknown)}</p></section>`:''}<section><h3>Prototype state</h3><p class="tiny muted">Map: ${esc(state.map)} · node: ${esc(n.id)} · zoom: ${Math.round(state.scale*100)}%</p></section>`;document.getElementById('close').onclick=()=>{state.selected=null;renderGraph()};el.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{select(b.dataset.related);centerNode(node(b.dataset.related))});if(d.jump)document.getElementById('jump').onclick=()=>{switchMap(...d.jump);centerNode(node(d.jump[1]))}}
function renderSearch(){const el=document.getElementById('search-list'),q=state.query.trim().toLowerCase();if(!q){el.hidden=true;return}const found=Object.entries(maps).flatMap(([map,m])=>m.nodes.filter(n=>n.title.toLowerCase().includes(q)).map(n=>({...n,map}))).slice(0,12);el.hidden=false;el.innerHTML=found.length?found.map(n=>`<button data-result="${n.map}:${n.id}">${esc(n.title)}<small>${esc(maps[n.map].name)}</small></button>`).join(''):'<div class="muted tiny" style="padding:10px">No matching node in these examples.</div>';el.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const [map,id]=b.dataset.result.split(':');if(map!==state.map)switchMap(map,id);else select(id);centerNode(node(id));state.query='';document.querySelector('.search').value='';el.hidden=true})}
function updateTransform(){const w=document.getElementById('world');if(!w)return;w.classList.toggle('overview',state.scale<.76);w.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;document.getElementById('zoom-label').textContent=Math.round(state.scale*100)+'%';drawMini()}
function fit(){const c=document.querySelector('.canvas-wrap'),m=maps[state.map];if(!c)return;const pad=56;state.scale=Math.min(1.25,(c.clientWidth-pad)/m.width,(c.clientHeight-pad)/m.height);state.tx=(c.clientWidth-m.width*state.scale)/2;state.ty=(c.clientHeight-m.height*state.scale)/2;updateTransform()}
function centerNode(n){const c=document.querySelector('.canvas-wrap');state.scale=Math.max(state.scale,.85);state.tx=c.clientWidth/2-(n.x+90)*state.scale;state.ty=c.clientHeight/2-(n.y+30)*state.scale;updateTransform()}
function zoomAt(factor,px,py){const c=document.querySelector('.canvas-wrap');px??=c.clientWidth/2;py??=c.clientHeight/2;const next=Math.max(.28,Math.min(2.2,state.scale*factor));state.tx=px-(px-state.tx)*(next/state.scale);state.ty=py-(py-state.ty)*(next/state.scale);state.scale=next;updateTransform()}
function drawMini(){const mini=document.getElementById('mini-svg');if(!mini)return;const m=maps[state.map],c=document.querySelector('.canvas-wrap');mini.setAttribute('viewBox',`0 0 ${m.width} ${m.height}`);const view={x:-state.tx/state.scale,y:-state.ty/state.scale,w:c.clientWidth/state.scale,h:c.clientHeight/state.scale};mini.innerHTML=m.edges.map(e=>{const a=m.nodes.find(n=>n.id===e.from),b=m.nodes.find(n=>n.id===e.to);return `<line x1="${a.x+180}" y1="${a.y+29}" x2="${b.x}" y2="${b.y+29}" stroke="#51565b" stroke-width="10"/>`}).join('')+m.nodes.map(n=>`<rect x="${n.x}" y="${n.y}" width="180" height="58" fill="${state.selected===n.id?'#e4f222':'#8b929a'}"/>`).join('')+`<rect x="${view.x}" y="${view.y}" width="${view.w}" height="${view.h}" fill="#e4f22218" stroke="#e4f222" stroke-width="12"/>`}
function setupCanvas(){const c=document.querySelector('.canvas-wrap');let drag=null;c.onpointerdown=e=>{if(e.target.closest('button')||e.target.closest('.zoom')||e.target.closest('.mini'))return;drag={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};c.setPointerCapture(e.pointerId);c.classList.add('dragging')};c.onpointermove=e=>{if(!drag)return;state.tx=drag.tx+e.clientX-drag.x;state.ty=drag.ty+e.clientY-drag.y;updateTransform()};c.onpointerup=()=>{drag=null;c.classList.remove('dragging')};c.onwheel=e=>{e.preventDefault();const r=c.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)};document.getElementById('mini').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),m=maps[state.map],x=(e.clientX-r.left)/r.width*m.width,y=(e.clientY-r.top)/r.height*m.height;state.tx=c.clientWidth/2-x*state.scale;state.ty=c.clientHeight/2-y*state.scale;updateTransform()}}
addEventListener('keydown',e=>{if(!state.consent)return;const typing=e.target.matches('input,textarea,[contenteditable]');if(e.key==='Escape'){state.selected=null;state.query='';document.querySelector('.search').value='';document.getElementById('search-list').hidden=true;renderGraph()}if(typing)return;if(e.key==='+'||e.key==='=')zoomAt(1.2);if(e.key==='-')zoomAt(.8);if(e.key==='0')fit();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const list=maps[state.map].nodes,idx=list.findIndex(n=>n.id===state.selected),next=list[(idx+(e.key==='ArrowRight'?1:list.length-1))%list.length];select(next.id);centerNode(next)}});
addEventListener('resize',()=>{if(state.consent)fit()});const hash=decodeURIComponent(location.hash.slice(1));const found=Object.entries(maps).find(([,m])=>m.nodes.some(n=>n.id===hash));if(found){state.map=found[0];state.selected=hash}else if(maps[hash])state.map=hash;renderShell();
</script></body></html>
