<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ra9-atlas — The Hostage (PoC3)</title>
<style>
:root{
  color-scheme:light;
  --canvas:#ffffff; --light:#f5f5f7; --ink:#1d1d1f; --gray:#707070;
  --border:#d6d6d6; --blue:#0066cc; --hair:#ebebed; --edge:#c9c9ce; --dash:#cfcfd4;
}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--canvas);color:var(--ink)}
button,input{font:inherit}
button{color:inherit;cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--gray)}
.tiny{font-size:11px}
.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--gray);font-weight:600}

/* Spoiler gate */
.cover{height:100%;display:grid;place-items:center;padding:24px;background:var(--canvas)}
.cover-box{max-width:560px;border:1px solid var(--border);border-radius:8px;padding:32px;background:#fff}
.cover h1{font-size:26px;line-height:1.2;margin:10px 0 12px;font-weight:600}
.cover p{color:var(--gray);margin:0 0 12px}
.primary{background:var(--blue);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600}
.primary:hover{background:#0055aa}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--border);background:#fff;z-index:5}
.brand{min-width:210px}
.brand strong{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;color:var(--gray);font-size:11px}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.search{position:relative;width:210px}
.search input{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
.search input::placeholder{color:var(--gray)}
.results{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:280px;overflow:auto;z-index:9}
.results button{display:block;width:100%;text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair)}
.results button:last-child{border-bottom:none}
.results button:hover,.results button:focus{background:var(--light)}
.results .r-kind{display:block;color:var(--gray);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tool{border:1px solid var(--border);border-radius:8px;padding:7px 11px;background:#fff;color:var(--ink);white-space:nowrap}
.tool:hover{background:var(--light)}
.tool.active{border-color:var(--blue);color:var(--blue)}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.canvas-wrap{position:relative;overflow:hidden;background:var(--canvas);cursor:grab;touch-action:none}
.canvas-wrap.dragging{cursor:grabbing}
.world{position:absolute;top:0;left:0;transform-origin:0 0}
#backdrops,#markers{position:absolute;top:0;left:0;pointer-events:none}
#edges{position:absolute;top:0;left:0;overflow:visible}
.node{position:absolute;text-align:left;background:#fff;border:1px solid var(--border);border-radius:8px;
  padding:6px 9px;font-size:12px;letter-spacing:.02em;color:var(--ink);line-height:1.25;overflow:hidden}
.node:hover{border-color:var(--ink)}
.node.selected{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:1px}
.node.dimmed{opacity:.34}
.node .k{display:block;color:var(--gray);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.node.choice{padding:0;display:flex;flex-direction:column;justify-content:center}
.node.choice .opt{padding:6px 9px;border-bottom:1px solid var(--hair)}
.node.choice .opt:last-child{border-bottom:none}
.node.stage{background:var(--light);border-color:#e6e6e9;color:var(--gray);font-size:13px;letter-spacing:.08em;
  display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase}
.node.start{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;letter-spacing:.06em;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.node.flag{border-color:#c9c9ce}
.node.flag .k{color:#8a8a8f}
.node.ending{font-weight:600;letter-spacing:.05em;display:flex;align-items:center;padding-left:12px}
.node.ending::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:8px;flex:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2}
.edge.uncertain{stroke:var(--dash);stroke-dasharray:4 3}
.edge.active{stroke:var(--blue);stroke-width:1.7}
.edge.dimmed{opacity:.22}
.badge{stroke:none;fill:#fff}
.badge-ring{stroke:var(--dash);fill:#fff;stroke-width:1.2}
.badge-text{fill:var(--gray);font-size:9px;font-weight:700}
.backdrop{fill:var(--light);stroke:#e6e6e9;stroke-width:1}

.status{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:11px;color:var(--gray);max-width:min(60ch,70%)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);
  border:1px solid var(--border);border-radius:8px;padding:4px}
.zoom span{min-width:42px;text-align:center;font-size:11px;color:var(--gray)}
.legend{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:11px;color:var(--gray)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--edge);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--dash)}

.details{width:330px;border-left:1px solid var(--border);background:#fff;overflow:auto;padding:16px}
.details[hidden]{display:none}
.details h2{font-size:16px;margin:6px 0 10px;font-weight:600}
.details h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:18px 0 6px;font-weight:600}
.details p{margin:0 0 8px;color:var(--ink)}
.details .note{color:var(--gray)}
.badge-chip{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:10px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--gray)}
.badge-chip.uncertain{border-color:var(--dash);color:#8a8a8f}
.rowlist{display:flex;flex-direction:column;gap:4px}
.rowlist button{text-align:left;border:1px solid var(--hair);border-radius:8px;padding:6px 8px;font-size:12px}
.rowlist button:hover{background:var(--light)}
.rowlist .dir{color:var(--gray);margin-right:6px}
.opt-list{margin:0;padding-left:18px;color:var(--ink)}
.opt-list li{margin:2px 0}
.close{position:absolute;top:12px;right:14px;font-size:18px;line-height:1;color:var(--gray)}

@media(max-width:820px){
  .top{flex-wrap:wrap}
  .tools{order:2;width:100%;margin-left:0;flex-wrap:wrap}
  .workspace{display:block;position:relative}
  .details{position:absolute;right:0;top:0;bottom:0;width:min(90vw,340px);z-index:6;border-left:1px solid var(--border)}
  .search{flex:1;min-width:130px;width:auto}
  .brand{min-width:130px}
  .brand span{display:none}
}
</style>
</head>
<body><div id="app"></div>
<script src="hostage-data.js"></script>
<script>
/* PoC3 renderer: standalone, no dependencies. The map is the primary surface;
   the details panel is secondary and never replaces the graph. */
(function () {
  'use strict';
  var M = HOSTAGE;
  var byId = {};
  M.nodes.forEach(function (n) { byId[n.id] = n; });

  var state = { consent: false, selected: null, scale: 1, tx: 0, ty: 0, query: '', focus: false };
  var app = document.getElementById('app');
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var KIND_LABEL = {
    start: 'Start', action: 'Action', choice: 'Choice', flag: 'Warning flag',
    stage: 'Stage', ending: 'Ending'
  };

  /* ---------- orthogonal routing ---------- */
  function pathFor(edge, stagger) {
    var a = byId[edge.from], b = byId[edge.to];
    var fromY = edge.fromOption == null ? a.y + a.h / 2 :
      a.y + (edge.fromOption + 0.5) * a.h / a.options.length;
    var sameCol = Math.abs((a.x + a.w / 2) - (b.x + b.w / 2)) < 26;
    if (sameCol) {
      var cx = a.x + a.w / 2, dx = b.x + b.w / 2;
      return b.y > a.y
        ? 'M ' + cx + ' ' + (a.y + a.h) + ' V ' + b.y + ' H ' + dx
        : 'M ' + cx + ' ' + a.y + ' V ' + (b.y + b.h) + ' H ' + dx;
    }
    if (b.x >= a.x + a.w) {
      var sx = a.x + a.w, sy = fromY, tx = b.x, ty = b.y + b.h / 2;
      var mx = (edge.via != null) ? edge.via : (sx + tx) / 2 + stagger * 16;
      return 'M ' + sx + ' ' + sy + ' H ' + mx + ' V ' + ty + ' H ' + tx;
    }
    var bsx = a.x, bsy = fromY, btx = b.x + b.w, bty = b.y + b.h / 2;
    var bmx = (edge.via != null) ? edge.via : (bsx + btx) / 2 - stagger * 16;
    return 'M ' + bsx + ' ' + bsy + ' H ' + bmx + ' V ' + bty + ' H ' + btx;
  }

  function neighbours(id) {
    var set = {};
    M.edges.forEach(function (e) { if (e.from === id || e.to === id) { set[e.from] = 1; set[e.to] = 1; } });
    return set;
  }

  /* ---------- shell ---------- */
  function renderShell() {
    if (!state.consent) {
      app.innerHTML =
        '<div class="cover"><div class="cover-box">' +
        '<div class="eyebrow">ra9-atlas · PoC3</div>' +
        '<h1>The Hostage — full chapter map</h1>' +
        '<p>This map reveals every choice, action, stage and ending visible in the chapter flowchart, including terminal outcomes.</p>' +
        '<p class="tiny muted">Transcribed from one chapter-flowchart reference screenshot. Not in-game verified. No game art is embedded.</p>' +
        '<button class="primary" id="consent">Reveal chapter map</button>' +
        '</div></div>';
      document.getElementById('consent').onclick = function () { state.consent = true; renderShell(); fit(); };
      return;
    }

    app.innerHTML =
      '<div class="app">' +
        '<header class="top">' +
          '<div class="brand"><strong>ra9-atlas</strong><span>The Hostage · PoC3 · transcribed flowchart</span></div>' +
          '<div class="tools">' +
            '<div class="search"><input id="q" type="search" placeholder="Search labels…" aria-label="Search labels" autocomplete="off">' +
              '<div class="results" id="results" hidden></div></div>' +
            '<button class="tool" id="focus" title="Dim nodes unrelated to the selection">Focus</button>' +
            '<button class="tool" id="fit" title="Fit the whole chapter">Fit</button>' +
            '<button class="tool" id="reset" title="Clear selection and search">Reset</button>' +
          '</div>' +
        '</header>' +
        '<div class="workspace">' +
          '<main class="canvas-wrap" id="canvas" aria-label="The Hostage chapter flowchart">' +
            '<div class="world" id="world">' +
              '<svg id="backdrops"></svg>' +
              '<svg id="edges"></svg>' +
              '<div id="nodes"></div>' +
              '<svg id="markers"></svg>' +
            '</div>' +
            '<div class="legend"><i></i>traced connector<br><i class="dash"></i>uncertain connector</div>' +
            '<div class="status" id="status"></div>' +
            '<div class="zoom"><button class="tool" id="minus" aria-label="Zoom out">−</button>' +
              '<span id="zoomLabel"></span>' +
              '<button class="tool" id="plus" aria-label="Zoom in">+</button></div>' +
          '</main>' +
          '<aside class="details" id="details" hidden></aside>' +
        '</div>' +
      '</div>';

    document.getElementById('focus').onclick = function () {
      state.focus = !state.focus; renderGraph();
    };
    document.getElementById('fit').onclick = fit;
    document.getElementById('reset').onclick = function () {
      state.selected = null; state.query = ''; state.focus = false;
      document.getElementById('q').value = ''; renderGraph();
    };
    document.getElementById('minus').onclick = function () { zoomAt(0.82); };
    document.getElementById('plus').onclick = function () { zoomAt(1.22); };
    document.getElementById('q').oninput = function (ev) { state.query = ev.target.value; renderSearch(); };
    setupCanvas();
    renderGraph();
  }

  /* ---------- graph ---------- */
  function renderGraph() {
    var world = document.getElementById('world');
    world.style.width = M.canvas.width + 'px';
    world.style.height = M.canvas.height + 'px';

    var bd = document.getElementById('backdrops');
    bd.setAttribute('viewBox', '0 0 ' + M.canvas.width + ' ' + M.canvas.height);
    bd.setAttribute('width', M.canvas.width); bd.setAttribute('height', M.canvas.height);
    bd.innerHTML = M.nodes.filter(function (n) { return n.frame; }).map(function (n) {
      var f = n.frame;
      return '<rect class="backdrop" x="' + f.x + '" y="' + f.y + '" width="' + f.w + '" height="' + f.h + '" rx="8"></rect>';
    }).join('');

    var svg = document.getElementById('edges');
    svg.setAttribute('viewBox', '0 0 ' + M.canvas.width + ' ' + M.canvas.height);
    svg.setAttribute('width', M.canvas.width); svg.setAttribute('height', M.canvas.height);

    var focus = state.selected ? neighbours(state.selected) : null;
    var stagger = {};
    var paths = [];
    var markers = '';
    M.edges.forEach(function (e) {
      stagger[e.from] = stagger[e.from] || 0;
      var d = pathFor(e, stagger[e.from]++);
      var active = state.selected && (e.from === state.selected || e.to === state.selected);
      var dim = state.focus && focus && !active;
      paths.push('<path class="edge ' + (e.certainty === 'uncertain' ? 'uncertain ' : '') +
        (active ? 'active ' : '') + (dim ? 'dimmed' : '') + '" d="' + d + '"></path>');
      if (e.certainty === 'uncertain') {
        markers += '<g class="' + (dim ? 'dimmed' : '') + '" transform="translate(0,0)">' +
          '<circle class="badge-ring" r="7"></circle><text class="badge-text" text-anchor="middle" dy="3.5">?</text></g>';
      }
    });
    svg.innerHTML = paths.join('');

    var mk = document.getElementById('markers');
    mk.setAttribute('viewBox', '0 0 ' + M.canvas.width + ' ' + M.canvas.height);
    mk.setAttribute('width', M.canvas.width); mk.setAttribute('height', M.canvas.height);
    mk.innerHTML = markers;
    /* place ? badges at each uncertain path midpoint now that the DOM has lengths */
    var badgeNodes = mk.querySelectorAll('g');
    var uncertainPaths = svg.querySelectorAll('path.uncertain');
    for (var i = 0; i < badgeNodes.length && i < uncertainPaths.length; i++) {
      var len = uncertainPaths[i].getTotalLength();
      var pt = uncertainPaths[i].getPointAtLength(len / 2);
      badgeNodes[i].setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ')');
    }

    var nodesHtml = M.nodes.map(function (n) {
      var classes = ['node', n.kind];
      if (state.selected === n.id) classes.push('selected');
      if (state.focus && focus && !focus[n.id] && state.selected !== n.id) classes.push('dimmed');
      var inner;
      if (n.kind === 'choice') {
        inner = n.options.map(function (o) { return '<span class="opt">' + esc(o) + '</span>'; }).join('');
      } else {
        inner = '<span class="label">' + esc(n.label) + '</span>';
      }
      return '<button class="' + classes.join(' ') + '" data-node="' + n.id + '" style="left:' + n.x + 'px;top:' + n.y +
        'px;width:' + n.w + 'px;height:' + n.h + 'px" aria-label="' + esc(n.label) + ' (' + KIND_LABEL[n.kind] + ')">' +
        (n.kind === 'choice' ? inner : '<span class="k">' + KIND_LABEL[n.kind] + '</span>' + inner) +
        '</button>';
    }).join('');
    document.getElementById('nodes').innerHTML = nodesHtml;
    Array.prototype.forEach.call(document.querySelectorAll('[data-node]'), function (b) {
      b.onclick = function (ev) { ev.stopPropagation(); select(b.getAttribute('data-node')); };
    });

    document.getElementById('status').innerHTML =
      esc(M.meta.chapter) + ' · ' + M.meta.counts.labels + ' labels · ' + M.meta.counts.nodes +
      ' boxes · ' + M.meta.counts.certainEdges + ' traced + ' + M.meta.counts.uncertainEdges +
      ' uncertain connectors · ' + esc(M.meta.reference);

    renderDetails();
    updateTransform();
  }

  function select(id, center) {
    state.selected = id;
    renderGraph();
    if (center) centerOn(byId[id]);
    else ensureVisible(byId[id]);
  }

  function renderDetails() {
    var el = document.getElementById('details');
    if (!state.selected) { el.hidden = true; el.innerHTML = ''; return; }
    var n = byId[state.selected];
    el.hidden = false;

    var related = M.edges.filter(function (e) { return e.from === n.id || e.to === n.id; });
    var rows = related.map(function (e) {
      var outgoing = e.from === n.id;
      var other = byId[outgoing ? e.to : e.from];
      var dir = outgoing ? '→' : '←';
      var flag = e.certainty === 'uncertain' ? ' · uncertain' : ' · traced';
      return '<button data-goto="' + other.id + '"><span class="dir">' + dir + '</span>' +
        (outgoing && e.fromOption != null ? esc(n.options[e.fromOption]) + ' → ' : '') +
        esc(other.label) + flag + '</button>';
    }).join('');

    var optBlock = n.kind === 'choice'
      ? '<h3>Options in screenshot</h3><ul class="opt-list">' +
        n.options.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>'
      : '';

    el.innerHTML =
      '<button class="close" id="dclose" aria-label="Close details">×</button>' +
      '<div class="eyebrow">' + esc(KIND_LABEL[n.kind]) + '</div>' +
      '<h2>' + esc(n.label) + '</h2>' +
      '<span class="badge-chip">' + esc(M.meta.chapter) + '</span>' +
      optBlock +
      (n.note ? '<h3>Note</h3><p class="note">' + esc(n.note) + '</p>' : '') +
      '<h3>Connectors (' + related.length + ')</h3>' +
      '<div class="rowlist">' + (rows || '<p class="muted tiny">No connector visible in the screenshot.</p>') + '</div>' +
      '<h3>Evidence</h3>' +
      '<p class="tiny muted">Secondary reference only. Version: ' + esc(M.meta.version) +
      '. Platform: ' + esc(M.meta.platform) + '. Not in-game verified.</p>' +
      '<p class="tiny"><a href="' + M.sources.steam + '" target="_blank" rel="noopener noreferrer">Steam chapter flowchart guide ↗</a></p>' +
      '<p class="tiny muted">Reference image: ' + esc(M.sources.steamImage) + '</p>';

    document.getElementById('dclose').onclick = function () { state.selected = null; renderGraph(); };
    Array.prototype.forEach.call(el.querySelectorAll('[data-goto]'), function (b) {
      b.onclick = function () { select(b.getAttribute('data-goto'), true); };
    });
  }

  /* ---------- search ---------- */
  function renderSearch() {
    var el = document.getElementById('results');
    var q = state.query.trim().toLowerCase();
    if (!q) { el.hidden = true; el.innerHTML = ''; return; }
    var hits = M.nodes.filter(function (n) {
      var text = n.label + ' ' + (n.options || []).join(' ');
      return text.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 12);
    el.hidden = false;
    el.innerHTML = hits.length ? hits.map(function (n) {
      return '<button data-hit="' + n.id + '">' + esc(n.label) +
        '<span class="r-kind">' + KIND_LABEL[n.kind] + '</span></button>';
    }).join('') : '<button disabled class="muted">No matching label</button>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-hit]'), function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-hit');
        state.query = ''; document.getElementById('q').value = ''; el.hidden = true;
        select(id, true);
      };
    });
  }

  /* ---------- transform ---------- */
  function updateTransform() {
    var w = document.getElementById('world');
    if (!w) return;
    w.style.transform = 'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')';
    document.getElementById('zoomLabel').textContent = Math.round(state.scale * 100) + '%';
  }
  function fit() {
    var c = document.getElementById('canvas');
    if (!c) return;
    var pad = 48;
    state.scale = Math.min(1.1, (c.clientWidth - pad) / M.canvas.width, (c.clientHeight - pad) / M.canvas.height);
    state.tx = (c.clientWidth - M.canvas.width * state.scale) / 2;
    state.ty = (c.clientHeight - M.canvas.height * state.scale) / 2;
    updateTransform();
  }
  function centerOn(n) {
    var c = document.getElementById('canvas');
    state.scale = Math.max(state.scale, 0.7);
    state.tx = c.clientWidth / 2 - (n.x + n.w / 2) * state.scale;
    state.ty = c.clientHeight / 2 - (n.y + n.h / 2) * state.scale;
    updateTransform();
  }
  function ensureVisible(n) {
    var c = document.getElementById('canvas'), pad = 24;
    var l = n.x * state.scale + state.tx, r = (n.x + n.w) * state.scale + state.tx;
    var t = n.y * state.scale + state.ty, b = (n.y + n.h) * state.scale + state.ty;
    if (l < pad) state.tx += pad - l; else if (r > c.clientWidth - pad) state.tx -= r - (c.clientWidth - pad);
    if (t < pad) state.ty += pad - t; else if (b > c.clientHeight - pad) state.ty -= b - (c.clientHeight - pad);
    updateTransform();
  }
  function zoomAt(factor, px, py) {
    var c = document.getElementById('canvas');
    if (px == null) px = c.clientWidth / 2;
    if (py == null) py = c.clientHeight / 2;
    var next = Math.max(0.2, Math.min(2.4, state.scale * factor));
    state.tx = px - (px - state.tx) * (next / state.scale);
    state.ty = py - (py - state.ty) * (next / state.scale);
    state.scale = next;
    updateTransform();
  }

  /* ---------- input ---------- */
  function setupCanvas() {
    var c = document.getElementById('canvas');
    var drag = null;
    c.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
      c.setPointerCapture(e.pointerId); c.classList.add('dragging');
    });
    c.addEventListener('pointermove', function (e) {
      if (!drag) return;
      state.tx = drag.tx + e.clientX - drag.x;
      state.ty = drag.ty + e.clientY - drag.y;
      updateTransform();
    });
    c.addEventListener('pointerup', function () { drag = null; c.classList.remove('dragging'); });
    c.addEventListener('pointercancel', function () { drag = null; c.classList.remove('dragging'); });
    c.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = c.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  }

  window.addEventListener('keydown', function (e) {
    if (!state.consent) return;
    var typing = e.target.matches && e.target.matches('input,textarea,[contenteditable]');
    if (e.key === 'Escape') {
      state.selected = null; state.query = '';
      var q = document.getElementById('q');
      if (q) q.value = '';
      var res = document.getElementById('results');
      if (res) { res.hidden = true; res.innerHTML = ''; }
      renderGraph();
      return;
    }
    if (typing) return;
    if (e.key === '+' || e.key === '=') zoomAt(1.2);
    if (e.key === '-') zoomAt(0.82);
    if (e.key === '0') fit();
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var idx = M.nodes.findIndex(function (n) { return n.id === state.selected; });
      var next = M.nodes[(idx + (e.key === 'ArrowRight' ? 1 : M.nodes.length - 1) + M.nodes.length) % M.nodes.length];
      select(next.id, true);
    }
  });

  window.addEventListener('resize', function () { if (state.consent) fit(); });

  renderShell();
})();
</script>
</body>
</html>
